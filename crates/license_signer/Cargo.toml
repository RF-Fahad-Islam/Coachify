[package]
name = "coachify_license_signer"
version = "0.1.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
ring = "0.17"
jiff = "0.2"
