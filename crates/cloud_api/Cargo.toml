[package]
name = "coachify_cloud_api"
version = "0.1.0"
edition = "2021"

[dependencies]
coachify_license_signer = { path = "../license_signer" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
specta = { version = "2.0.0-rc.25", features = ["derive", "serde_json"] }
thiserror = "2.0"
rusqlite = { version = "0.32", features = ["bundled"] }
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
argon2 = "0.5"
jiff = "0.2"
uuid = { version = "1.10", features = ["v7", "serde"] }
