[package]
name = "coachify_desktop_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "coachify_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "coachify"
path = "src/main.rs"

[dependencies]
coachify_core = { path = "../crates/core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
