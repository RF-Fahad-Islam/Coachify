[package]
name = "coachify_desktop_lib"
version = "0.1.0"
edition = "2021"

[lib]
name = "coachify_desktop_lib"
crate-type = ["rlib"]

[[bin]]
name = "coachify"
path = "src/main.rs"

[dependencies]
coachify_core = { path = "../crates/core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
thiserror = "2"

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
